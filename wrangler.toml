name = "thrjtech-main-preview"
main = "worker.js"
compatibility_date = "2026-03-13"

[assets]
directory = "./build/client"
binding = "STATIC_ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
